<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {%- for p in site.pages %}
        {%- if p.title and p.includelink %}
      <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
        {%- endif %}
      {%- endfor %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅色" title="切换深浅色">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>
