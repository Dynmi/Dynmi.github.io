---
layout: default
---
<article class="post page" lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <header class="page-header">
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="post-content" id="content">
{{ content }}
  </div>
  {%- if page.comments %}
  {% include comments.html %}
  {%- endif %}
</article>
{%- if page.mathjax %}
{% include mathjax.html %}
{%- endif %}
